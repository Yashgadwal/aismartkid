<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#grad)" />
  <!-- Robot Face Outline -->
  <rect x="7" y="11" width="18" height="12" rx="3" fill="none" stroke="white" stroke-width="2" />
  <!-- Eyes -->
  <circle cx="12" cy="17" r="1.5" fill="white" />
  <circle cx="20" cy="17" r="1.5" fill="white" />
  <!-- Antenna -->
  <line x1="16" y1="11" x2="16" y2="7" stroke="white" stroke-width="2" stroke-linecap="round" />
  <circle cx="16" cy="6" r="2" fill="#FF8A00" />
</svg>
