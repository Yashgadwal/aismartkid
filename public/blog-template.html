<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{SEO_TITLE}}</title>
  <meta name="description" content="{{SEO_DESCRIPTION}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=4">
  
  <!-- Open Graph Meta Tags for Facebook/WhatsApp sharing -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{SEO_TITLE}}">
  <meta property="og:description" content="{{SEO_DESCRIPTION}}">
  <meta property="og:image" content="https://aismartkid.vercel.app{{BLOG_IMAGE}}">
  
  <style>
    .article-container {
      max-width: 760px;
      margin: 120px auto 60px auto;
      padding: 0 16px;
    }
    .article-card {
      background: rgba(255, 255, 255, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.03);
      overflow: hidden;
      padding: 40px;
    }
    .article-meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #94A3B8;
    }
    .article-title {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--color-text-dark);
      margin: 0 0 28px 0;
    }
    .article-hero-image {
      width: 100%;
      height: 380px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 32px;
      background: #f1f5f9;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .article-hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .article-body {
      color: var(--color-text-gray);
      line-height: 1.85;
      font-size: 14.5px;
    }
    .blog-paragraph {
      margin-bottom: 20px;
    }
    .blog-subheading {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 800;
      color: var(--color-text-dark);
      margin-top: 36px;
      margin-bottom: 14px;
    }
    .back-to-blogs {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--color-primary);
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 24px;
      transition: transform 0.2s ease;
    }
    .back-to-blogs:hover {
      transform: translateX(-4px);
    }
    @media (max-width: 600px) {
      .article-card {
        padding: 24px;
      }
      .article-title {
        font-size: 24px;
        margin-bottom: 16px;
      }
      .article-hero-image {
        height: 220px;
        margin-bottom: 24px;
      }
    }
  </style>
</head>
<body class="mesh-glow">

  <!-- HEADER -->
  <header>
    <div class="container header-container">
      <a href="/" class="logo-block">
        <img loading="lazy" src="/images/logoai.jpeg" alt="AI Smart Kids Logo" style="height: 38px; width: auto; border-radius: 8px; object-fit: contain;">
        <div class="logo-text">
          <h1>AI SMART KIDS</h1>
          <span>UJJAIN'S FIRST AI INSTITUTE</span>
        </div>
      </a>
      <nav>
        <a href="/">Home</a>
        <a href="/blog">Blogs</a>
        <a href="tel:+918308507820" class="btn btn-orange" style="padding: 8px 16px; font-size:12px;">Call Mentor</a>
      </nav>
    </div>
  </header>

  <!-- ARTICLE CONTAINER -->
  <div class="article-container">
    <a href="/blog" class="back-to-blogs">← Back to Articles</a>
    
    <article class="article-card">
      <div class="article-meta-row">
        <span class="badge-tag" style="margin: 0; background: rgba(37,99,235,0.06); color: var(--color-primary);">{{BLOG_CATEGORY}}</span>
        <span>&bull;</span>
        <span>{{BLOG_DATE}}</span>
      </div>
      
      <h1 class="article-title">{{BLOG_TITLE}}</h1>
      
      <div class="article-hero-image">
        <img src="{{BLOG_IMAGE}}" alt="{{BLOG_TITLE}}">
      </div>
      
      <div class="article-body">
        {{BLOG_CONTENT}}
      </div>
    </article>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="container footer-container">
      <div class="footer-logo">
        <img loading="lazy" src="/images/logoai.jpeg" alt="AI Smart Kids Logo" style="height: 24px; width: auto; border-radius: 4px; object-fit: contain;">
        <span>AI SMART KIDS</span>
      </div>
      <div style="text-align: center;">
        <p style="margin: 0;">&copy; 2026 AI Smart Kids, Ujjain. All rights reserved.</p>
      </div>
      <div class="footer-links">
        <a href="/privacy.html">Privacy Policy</a>
        <a href="/terms.html">Terms of Service</a>
      </div>
    </div>
  </footer>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
